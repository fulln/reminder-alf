[project]
name = "reminder-alf"
version = "1.0.0"
description = "AI-powered calendar and reminder management for Alfred on macOS"
authors = [{name = "Reminder-Alf Contributors"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["alfred", "workflow", "calendar", "reminder", "ai", "nlp", "macos", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/fulln/reminder-alf"
Repository = "https://github.com/fulln/reminder-alf"
Documentation = "https://github.com/fulln/reminder-alf/blob/main/README.md"
Issues = "https://github.com/fulln/reminder-alf/issues"
Changelog = "https://github.com/fulln/reminder-alf/blob/main/CHANGELOG.md"

dependencies = [
    "pyobjc-framework-EventKit>=10.0",
    "alfred-workflow>=1.39.0",
    "keyring>=24.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
