<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder-Alf 导入助手</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-primary: #8b5cf6;
            --accent-secondary: #ec4899;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            z-index: 1;
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 0.75rem;
            color: var(--text-primary);
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            resize: none;
            margin-bottom: 1.5rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--accent-primary);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Premium Apple-style Button */
        .apple-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-sizing: border-box;
        }

        .apple-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }

        .apple-button svg {
            color: var(--accent-primary);
        }

        .results {
            margin-top: 2rem;
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .item-list {
            display: grid;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent-primary);
        }

        .item-info h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .item-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .badge-reminder {
            border-left-color: var(--accent-secondary);
        }

        .hidden {
            display: none;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            margin-top: auto;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            opacity: 0.6;
            padding-top: 2rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="lang-switcher">
            <select id="langSelect" class="lang-select">
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
        </div>
        <header>
            <h1>reminders.work</h1>
            <p class="subtitle" data-i18n="subtitle">AI Smart Agenda: Cross-device One-click Import Assistant</p>
        </header>

        <div class="card">
            <textarea id="importInput" data-i18n-placeholder="placeholder"
                placeholder="Paste import code here..."></textarea>
            <button class="btn btn-primary" id="decodeBtn">
                <span data-i18n="decodeBtn">🚀 Parse and Prepare</span>
            </button>
            <button class="btn btn-secondary hidden" id="pasteBtn">
                <span data-i18n="pasteBtn">📋 Paste from Clipboard</span>
            </button>
        </div>

        <div id="results" class="results">
            <div id="eventSection" class="hidden">
                <div class="section-title">📅 <span data-i18n="eventsFound">Events Found</span></div>
                <div id="eventList" class="item-list"></div>
            </div>

            <div id="reminderSection" class="hidden" style="margin-top: 2rem;">
                <div class="section-title">🔔 <span data-i18n="remindersFound">Reminders Found</span></div>
                <div id="reminderList" class="item-list"></div>
            </div>

            <div id="importActions" class="hidden"
                style="margin-top: 2rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                <button class="btn btn-primary" style="background: var(--success);" id="downloadIcsBtn">
                    <span data-i18n="importBtn">✨ Import to Calendar & Reminders</span>
                </button>
                <p style="text-align: center; color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.5rem;"
                    data-i18n="supportPlatforms">
                    (Supports iOS & Android)
                </p>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 reminders.work | Powered by Reminder-Alf AI
        </div>
    </div>

    <script>
        const translations = {
            en: {
                subtitle: "AI Smart Agenda: Cross-device One-click Import Assistant",
                placeholder: "Paste import code here...",
                decodeBtn: "🚀 Parse and Prepare",
                pasteBtn: "📋 Paste from Clipboard",
                eventsFound: "Events Found",
                remindersFound: "Reminders Found",
                importBtn: "✨ Import to Calendar & Reminders",
                supportPlatforms: "(Supports iOS & Android)",
                unknownLocation: "Unknown Location",
                noDueDate: "No Due Date",
                copied: "Copied: ",
                browserLegacy: "Sorry, your browser is too old to support the decompression required for import.\nPlease try updating or using Safari/Chrome.",
                parseFailed: "Parsing failed: Invalid or damaged code.\n\nDetail: ",
                parseFailedTip: "\n\nTip: Ensure you copied the entire block.",
                clipboardFailed: "Failed to read clipboard. Please paste manually.",
                importSuccess: "✨ Exported!",
                importSuccessTip: "Calendar and reminders have been exported as an .ics file.\n\nPlease open the downloaded file ('trip_events.ics') to complete the import into your system."
            },
            zh: {
                subtitle: "AI 灵动日程：跨设备一键导入助手",
                placeholder: "在此粘贴导入口令...",
                decodeBtn: "🚀 解析并准备导入",
                pasteBtn: "📋 从剪贴板粘贴",
                eventsFound: "发现行程日程",
                remindersFound: "发现提醒事项",
                importBtn: "✨ 一键导入系统日历与提醒",
                supportPlatforms: "(支持 iOS 与 Android 系统)",
                unknownLocation: "未知位置",
                noDueDate: "无截止时间",
                copied: "已拷贝标题: ",
                browserLegacy: "抱歉，您的浏览器太旧，不支持一键导入所需的解压功能。\n请尝试更新浏览器或使用最新版的 Safari/Chrome。",
                parseFailed: "解析失败：口令内容损坏或格式不正确。\n\n详情: ",
                parseFailedTip: "\n\n提示: 请确保复制了完整的口令区块。",
                clipboardFailed: "无法读取剪贴板，请手动粘贴。某些浏览器需在设置中开启权限。",
                importSuccess: "✨ 导出成功！",
                importSuccessTip: "日程和提醒事项已导出为 .ics 文件。\n\n请打开下载的文件 ('trip_events.ics') 即可完成导入系统日历/提醒事项。"
            }
        };

        let currentLang = localStorage.getItem('lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
        const langSelect = document.getElementById('langSelect');

        function updateUI() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
            langSelect.value = currentLang;
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
            if (currentData) renderResults(currentData);
        }

        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('lang', currentLang);
            updateUI();
        });

        const input = document.getElementById('importInput');
        const decodeBtn = document.getElementById('decodeBtn');
        const results = document.getElementById('results');
        const eventSection = document.getElementById('eventSection');
        const reminderSection = document.getElementById('reminderSection');
        const importActions = document.getElementById('importActions');
        const eventList = document.getElementById('eventList');
        const reminderList = document.getElementById('reminderList');
        const downloadIcsBtn = document.getElementById('downloadIcsBtn');
        const pasteBtn = document.getElementById('pasteBtn');

        let currentData = null;

        // Initial setup
        updateUI();

        // Clipboard Support Detection
        if (navigator.clipboard && navigator.clipboard.readText) {
            pasteBtn.classList.remove('hidden');
        }

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                input.value = text;
                autoDetect(text);
            } catch (err) {
                console.error('Failed to read clipboard: ', err);
                alert(translations[currentLang].clipboardFailed);
            }
        });

        // Auto-detect on page focus
        window.addEventListener('focus', async () => {
            if (navigator.clipboard && navigator.clipboard.readText) {
                try {
                    const text = await navigator.clipboard.readText();
                    if (isReminderAlfBlock(text) && input.value !== text) {
                        input.value = text;
                        autoDetect(text);
                    }
                } catch (e) { }
            }
        });

        function isReminderAlfBlock(text) {
            return text.includes('--- REMINDER-ALF START ---');
        }

        // Browser Compatibility Check
        if (!window.DecompressionStream) {
            alert(translations[currentLang].browserLegacy);
        }

        async function autoDetect(text) {
            if (isReminderAlfBlock(text)) {
                decodeBtn.click();
            }
        }

        decodeBtn.addEventListener('click', async () => {
            const raw = input.value;
            const match = raw.match(/--- REMINDER-ALF START ---\n?([\s\S]*?)\n?--- REMINDER-ALF END ---/);
            const b64 = (match ? match[1].trim() : raw.trim()).replace(/\s/g, '');

            try {
                const data = await decompressData(b64);
                currentData = data;
                renderResults(data);
            } catch (e) {
                console.error('Extraction failed:', e);
                try {
                    const json = atob(b64);
                    if (json.trim().startsWith('{') || json.trim().startsWith('[')) {
                        const data = JSON.parse(json);
                        currentData = data;
                        renderResults(data);
                        return;
                    }
                } catch (jsonErr) { }
                alert(translations[currentLang].parseFailed + e.message + translations[currentLang].parseFailedTip);
            }
        });

        async function decompressData(b64) {
            const binString = atob(b64);
            const bytes = new Uint8Array(binString.length);
            for (let i = 0; i < binString.length; i++) {
                bytes[i] = binString.charCodeAt(i);
            }
            if (bytes[0] !== 0x78) throw new Error('Not a compressed block');

            const ds = new DecompressionStream('deflate');
            const writer = ds.writable.getWriter();
            await writer.write(bytes);
            await writer.close();

            const response = new Response(ds.readable);
            const jsonStr = await response.text();
            const rawData = JSON.parse(jsonStr);

            if (rawData.v === 2) {
                return {
                    events: (rawData.e || []).map(ev => ({
                        title: ev.t, start_date: ev.s, end_date: ev.e, location: ev.l, notes: ev.n
                    })),
                    reminders: (rawData.r || []).map(rm => ({
                        title: rm.t, due_date: rm.d, priority: rm.p
                    }))
                };
            }
            return rawData;
        }

        function renderResults(data) {
            results.style.display = 'block';
            eventList.innerHTML = '';
            reminderList.innerHTML = '';
            const t = translations[currentLang];
            const df = new Intl.DateTimeFormat(currentLang === 'zh' ? 'zh-CN' : 'en-US', {
                month: 'short', day: 'numeric', hour: 'numeric', minute: 'numeric'
            });

            if (data.events && data.events.length > 0) {
                eventSection.classList.remove('hidden');
                data.events.forEach(ev => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-info">
                            <h3>${ev.title}</h3>
                            <p>${df.format(new Date(ev.start_date))} @ ${ev.location || t.unknownLocation}</p>
                        </div>
                    `;
                    eventList.appendChild(card);
                });
            } else {
                eventSection.classList.add('hidden');
            }

            if (data.reminders && data.reminders.length > 0) {
                reminderSection.classList.remove('hidden');
                data.reminders.forEach(rm => {
                    const card = document.createElement('div');
                    card.className = 'item-card badge-reminder';
                    card.innerHTML = `
                        <div class="item-info">
                            <h3>${rm.title}</h3>
                            <p>${rm.due_date ? df.format(new Date(rm.due_date)) : t.noDueDate}</p>
                        </div>
                        <button onclick="copyText('${rm.title}')" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">📋</button>
                    `;
                    reminderList.appendChild(card);
                });
            } else {
                reminderSection.classList.add('hidden');
            }

            if ((data.events && data.events.length > 0) || (data.reminders && data.reminders.length > 0)) {
                importActions.classList.remove('hidden');
            } else {
                importActions.classList.add('hidden');
            }
        }

        window.copyText = (text) => {
            navigator.clipboard.writeText(text).then(() => alert(translations[currentLang].copied + text));
        };

        downloadIcsBtn.addEventListener('click', () => {
            if (!currentData) return;

            let ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Reminder-Alf//Importer//CN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH'
            ];

            const formatDate = (iso) => {
                const d = new Date(iso);
                const pad = (n) => n.toString().padStart(2, '0');
                return d.getUTCFullYear() +
                    pad(d.getUTCMonth() + 1) +
                    pad(d.getUTCDate()) + 'T' +
                    pad(d.getUTCHours()) +
                    pad(d.getUTCMinutes()) +
                    pad(d.getUTCSeconds()) + 'Z';
            };

            // Add Events (VEVENT)
            if (currentData.events) {
                currentData.events.forEach(ev => {
                    ics.push('BEGIN:VEVENT');
                    ics.push(`SUMMARY:${ev.title}`);
                    ics.push(`DTSTART:${formatDate(ev.start_date)}`);
                    ics.push(`DTEND:${formatDate(ev.end_date)}`);
                    ics.push('CATEGORIES:Reminder-Alf');
                    if (ev.location) ics.push(`LOCATION:${ev.location}`);
                    if (ev.notes) ics.push(`DESCRIPTION:${ev.notes.replace(/\n/g, '\\n')}`);
                    ics.push('END:VEVENT');
                });
            }

            // Add Reminders (VTODO)
            if (currentData.reminders) {
                currentData.reminders.forEach(rm => {
                    ics.push('BEGIN:VTODO');
                    ics.push(`SUMMARY:${rm.title}`);
                    ics.push('CATEGORIES:Reminder-Alf');
                    if (rm.due_date) {
                        ics.push(`DUE:${formatDate(rm.due_date)}`);
                    }
                    ics.push('STATUS:NEEDS-ACTION');
                    ics.push('END:VTODO');
                });
            }

            ics.push('END:VCALENDAR');

            const blob = new Blob([ics.join('\n')], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'trip_events.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Provide feedback
            setTimeout(() => {
                alert(translations[currentLang].importSuccess + "\n\n" + translations[currentLang].importSuccessTip);
            }, 100);
        });
    </script>
</body>

</html>
