name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Run release script (dry-run)
      if: ${{ inputs.dry_run }}
      run: |
        chmod +x scripts/release.sh
        ./scripts/release.sh ${{ inputs.version_bump }} --dry-run

    - name: Run release script
      if: ${{ !inputs.dry_run }}
      run: |
        chmod +x scripts/release.sh
        ./scripts/release.sh ${{ inputs.version_bump }}

    - name: Get new version
      if: ${{ !inputs.dry_run }}
      id: version
      run: |
        VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Released version: $VERSION"

    - name: Build Alfred workflow
      if: ${{ !inputs.dry_run }}
      run: |
        python scripts/build_workflow.py

    - name: Build Python package
      if: ${{ !inputs.dry_run }}
      run: |
        python -m pip install --upgrade build
        python -m build

    - name: Create Release
      if: ${{ !inputs.dry_run }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        files: |
          Reminder-Alf.alfredworkflow
          dist/*.whl
          dist/*.tar.gz
        body: |
          ## Reminder-Alf ${{ steps.version.outputs.version }}

          ### 安装方法

          #### 方式1: Alfred Workflow（推荐）
          1. 下载 `Reminder-Alf.alfredworkflow`
          2. 双击文件导入到 Alfred
          3. 配置 AI: `ral config set openai sk-YOUR_KEY gpt-4`
          4. 开始使用: `ral Meeting tomorrow at 2pm`

          #### 方式2: Python Package
          从 Release 下载 `.whl` 文件后安装。

          ### 文档
          - [快速开始](https://github.com/${{ github.repository }}/blob/main/docs/QUICKSTART.md)
          - [完整文档](https://github.com/${{ github.repository }}/blob/main/README.md)
        fail_on_unmatched_files: false
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Summary
      if: ${{ !inputs.dry_run }}
      run: |
        echo "### ✅ Release Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
        echo "1. GitHub Actions will automatically build and publish" >> $GITHUB_STEP_SUMMARY
        echo "2. Check [Actions](https://github.com/${{ github.repository }}/actions) for build status" >> $GITHUB_STEP_SUMMARY
        echo "3. Release will appear at [Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
